<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>สมาชิกในกลุ่ม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+Thai:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --onyx: #08090c;
    --card-a: #16131b;
    --card-b: #211a29;
    --plate: #1a1620;
    --gold: #cda44e;
    --gold-light: #f3dfa4;
    --gold-deep: #8a6a26;
    --champagne: #efe6d3;
    --muted: #9c9486;
    --hair: rgba(205,164,78,0.22);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1200px 700px at 50% -10%, rgba(205,164,78,0.08), transparent 60%),
      var(--onyx);
    color: var(--champagne);
    font-family: 'IBM Plex Sans Thai', sans-serif;
    font-weight: 300;
    letter-spacing: 0.01em;
    line-height: 1.8;
    overflow-x: hidden;
  }

  .wrap { max-width: 1120px; margin: 0 auto; padding: 6rem 1.5rem 5rem; }

  header.hero { text-align: center; margin-bottom: 5rem; }

  .eyebrow {
    display: inline-flex; align-items: center; gap: 0.6rem;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.05rem;
    color: var(--gold); margin-bottom: 1.3rem;
  }
  .eyebrow::before, .eyebrow::after { content: ""; width: 34px; height: 1px; background: var(--gold-deep); }

  h1 {
    font-family: 'Noto Serif Thai', serif; font-weight: 600;
    font-size: clamp(2.1rem, 4.6vw, 3.1rem); margin: 0 0 1.1rem; color: var(--gold-light);
  }

  .lede { max-width: 46ch; margin: 0 auto; color: var(--muted); font-size: 1rem; font-weight: 300; }

  .members {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    justify-items: center;
    gap: 3rem 2rem;
    margin-top: 4rem;
  }
  @media (max-width: 900px) {
    .members { grid-template-columns: 1fr; max-width: 320px; margin-left: auto; margin-right: auto; }
  }

  .card-link { text-decoration: none; color: inherit; display: block; }

  .stage {
    perspective: 1600px;
    opacity: 0;
    transform: translateY(22px);
    animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  .members .card-link:nth-child(1) .stage { animation-delay: 0.06s; }
  .members .card-link:nth-child(2) .stage { animation-delay: 0.2s; }
  .members .card-link:nth-child(3) .stage { animation-delay: 0.34s; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  /* ===== the physical card ===== */
  .card {
    position: relative;
    width: 15.6rem;
    aspect-ratio: 5 / 7;
    border-radius: 14px;
    transform-style: preserve-3d;
    transform: scale(var(--scale, 1)) rotateX(var(--ry, 0deg)) rotateY(var(--rx, 0deg));
    background: linear-gradient(155deg, var(--gold-light), var(--gold) 28%, var(--gold-deep) 55%, var(--gold) 78%, var(--gold-light));
    padding: 3px;
    box-shadow:
      var(--shadow-x, 0px) var(--shadow-y, 18px) 40px -14px rgba(0,0,0,0.75),
      0 0 0 1px rgba(0,0,0,0.4);
    will-change: transform;
  }

  .card__inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 11px;
    background: linear-gradient(165deg, var(--card-a), var(--card-b) 60%, var(--card-a));
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transform: translateZ(1px);
  }

  /* holographic foil sheen — classic TCG rainbow, intensity rides on --holo */
  .card__holo {
    position: absolute; inset: 0;
    background-image: repeating-linear-gradient(
      100deg,
      hsl(2 90% 70%) 0%,
      hsl(53 90% 68%) 8%,
      hsl(100 80% 68%) 16%,
      hsl(176 85% 68%) 24%,
      hsl(228 85% 72%) 32%,
      hsl(283 80% 70%) 40%,
      hsl(2 90% 70%) 48%
    );
    background-size: 260% 260%;
    background-position: var(--mx, 50%) var(--my, 50%);
    mix-blend-mode: color-dodge;
    opacity: var(--holo, 0);
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  /* soft directional glare on top */
  .card__glare {
    position: absolute; inset: 0;
    background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 50%),
      rgba(255,255,255,0.55), rgba(255,255,255,0.08) 35%, transparent 62%);
    mix-blend-mode: overlay;
    opacity: var(--glare, 0);
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  /* fine metallic grain, always faintly present on the foil frame */
  .card__grain {
    position: absolute; inset: 0;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/></svg>");
    mix-blend-mode: overlay;
    opacity: 0.05;
    pointer-events: none;
  }

  .card__top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.85rem 1rem 0; transform: translateZ(46px);
  }
  .card__number {
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.95rem; color: var(--gold-light);
  }
  .card__rank { display: flex; gap: 2px; }
  .card__rank span { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }

.card__portrait {
  margin: 0.9rem auto 0;
  width: 6.6rem;
  height: 6.6rem;
  border-radius: 50%;
  overflow: hidden;
  border: 2px solid var(--gold);
  box-shadow:
    0 0 0 3px rgba(8,9,12,0.5),
    0 0 22px rgba(0,0,0,0.55);
  transform: translateZ(64px);
  background: #111;
}

.card__portrait img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

  .card__name {
    font-family: 'Noto Serif Thai', serif; font-weight: 600; font-size: 1.18rem;
    text-align: center; color: var(--champagne); margin: 1rem 0.6rem 0.15rem;
    transform: translateZ(50px);
  }
  .card__rule { width: 2.6rem; height: 1px; margin: 0.35rem auto 0.55rem; background: var(--gold-deep); transform: translateZ(44px); }
  .card__role {
    text-align: center; font-size: 0.8rem; color: var(--muted);
    letter-spacing: 0.03em; margin: 0 1rem; transform: translateZ(40px);
  }

  .card__spacer { flex: 1; }

  .card__bottom {
    margin-top: auto; padding: 0.8rem 1rem 1rem;
    border-top: 1px solid var(--hair);
    display: flex; align-items: center; justify-content: center; gap: 0.4rem;
    font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.98rem;
    color: var(--gold); transform: translateZ(34px);
  }
  .card-link:hover .card__bottom, .card-link.active .card__bottom { color: var(--gold-light); }

  footer { text-align: center; margin-top: 5rem; color: var(--muted); font-size: 0.85rem; }

  @media (prefers-reduced-motion: reduce) {
    .stage { animation: none; opacity: 1; transform: none; }
    .card { transition: none; }
  }

  a:focus-visible, .card-link:focus-visible { outline: 2px solid var(--gold); outline-offset: 6px; }
</style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <span class="eyebrow">โปรเจกต์กลุ่ม</span>
      <h1>สมาชิกในกลุ่มของเรา</h1>

    </header>

    <main class="members">
      <a class="card-link" href="person1.html">
        <div class="stage"><div class="card" data-tilt>

      <a class="card-link" href="person2.html">

              <span class="card__rank"><span></span><span></span><span></span></span>

                <img src="https://www.lannapoly.ac.th/online/Stu_picture/67219010038.jpg" alt="สมาชิกคนที่ 1">

            </div>
            <div class="card__portrait"><img src="https://lh3.googleusercontent.com/chat_attachment/AP1Ws4uO32fdAw9BqBVxX58HwD-7_P7cCMny7tASx-W92hBqMo97x-aIGew3S-0qZFsVBr8BQb89_CvPB9r615Z7MrtVdhDUPXq-rmFLZsRXgtjS1djr6sM6_K0SHhPbUfV9BE95JatGAXxju3dgw3zqIFNPypxAO6ptqBeazUCld42xnI0ajyHrPZk-aR5tZTpXx6oCgKkVyQaF_196-xVOusebQQWQVuQ2Ga9GVfzsBI1BQzD4AH7cbpVhfYJk7Wwq0Q1YJ3zi1AjJC6xi79vZdXGAoSKvLUEd8QWy-ATqq-RYlZ0671jv1JEXaAkzsjz8sEM=w958-h910-rw" alt="สมาชิกคนที่ 3"></div>

<script>
(function () {
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var isFinePointer = window.matchMedia('(pointer: fine)').matches;
  if (reduceMotion || !isFinePointer) return;

  document.querySelectorAll('[data-tilt]').forEach(function (card) {
    var link = card.closest('.card-link');
    var bounds = null;
    var raf = null;

    var state  = { rx: 0, ry: 0, mx: 50, my: 50, scale: 1, sx: 0, sy: 18, holo: 0, glare: 0 };
    var target = { rx: 0, ry: 0, mx: 50, my: 50, scale: 1, sx: 0, sy: 18, holo: 0, glare: 0 };

    function apply() {
      var ease = 0.16;
      Object.keys(state).forEach(function (k) {
        state[k] += (target[k] - state[k]) * ease;
      });

      card.style.setProperty('--rx', state.rx.toFixed(2) + 'deg');
      card.style.setProperty('--ry', state.ry.toFixed(2) + 'deg');
      card.style.setProperty('--mx', state.mx.toFixed(1) + '%');
      card.style.setProperty('--my', state.my.toFixed(1) + '%');
      card.style.setProperty('--scale', state.scale.toFixed(3));
      card.style.setProperty('--shadow-x', state.sx.toFixed(1) + 'px');
      card.style.setProperty('--shadow-y', state.sy.toFixed(1) + 'px');
      card.style.setProperty('--holo', state.holo.toFixed(3));
      card.style.setProperty('--glare', state.glare.toFixed(3));

      var moving = Object.keys(state).some(function (k) { return Math.abs(target[k] - state[k]) > 0.02; });
      raf = moving ? requestAnimationFrame(apply) : null;
    }
    function kick() { if (!raf) raf = requestAnimationFrame(apply); }

    link.addEventListener('mouseenter', function () {
      bounds = card.getBoundingClientRect();
      link.classList.add('active');
      target.scale = 1.07;
      kick();
    });

    link.addEventListener('mousemove', function (e) {
      if (!bounds) bounds = card.getBoundingClientRect();
      var px = Math.min(1, Math.max(0, (e.clientX - bounds.left) / bounds.width));
      var py = Math.min(1, Math.max(0, (e.clientY - bounds.top) / bounds.height));
      var distFromCenter = Math.hypot(px - 0.5, py - 0.5) / 0.707; // 0 at center, 1 at corner

      target.rx = (px - 0.5) * 34;   // rotateY — full up/down/left/right range
      target.ry = (0.5 - py) * 34;   // rotateX
      target.mx = px * 100;
      target.my = py * 100;
      target.sx = (px - 0.5) * -46;
      target.sy = 20 + (py - 0.5) * 20;
      target.holo = 0.28 + distFromCenter * 0.5;
      target.glare = 0.7;
      kick();
    });

    link.addEventListener('mouseleave', function () {
      link.classList.remove('active');
      target = { rx: 0, ry: 0, mx: 50, my: 50, scale: 1, sx: 0, sy: 18, holo: 0, glare: 0 };
      kick();
    });
  });
})();
</script>
